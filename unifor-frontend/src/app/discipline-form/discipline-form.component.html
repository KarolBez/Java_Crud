<h2>{{ editingDiscipline ? 'Editar' : 'Nova' }} Disciplina</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <label>Nome:</label>
  <input formControlName="name" />

  <label>Semestre (número):</label>
  <input type="number" formControlName="semester" />

  <label>Curso:</label>
  <select formControlName="courseId">
    <option value="">Selecione</option>
    <option *ngFor="let course of courses" [value]="course.id">
      {{ course.name }}
    </option>
  </select>

  <button type="submit">{{ editingDiscipline ? 'Atualizar' : 'Criar' }}</button>
</form>
